{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AI NIDS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'ids_app/css/style.css' %}">
</head>
<body style="background:#0a0d14; padding-top:0;">

<div class="login-wrapper" style="min-height:100vh;">
  <div class="login-card">
    <div class="text-center mb-4">
      <div style="font-size:3rem;">🛡️</div>
      <h3 class="fw-bold mt-2">AI <span class="text-danger">NIDS</span></h3>
      <p class="text-muted small">Network Intrusion Detection System</p>
    </div>

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} py-2 small">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small text-muted">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label small text-muted">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted">Don't have an account? <a href="{% url 'register' %}" class="text-primary">Register</a></small>
    </div>

    <div class="mt-4 p-3 rounded" style="background:rgba(13,110,253,0.07); border:1px solid rgba(13,110,253,0.2);">
      <small class="text-muted d-block text-center">
        <i class="bi bi-info-circle me-1"></i>Default: <code>admin</code> / <code>admin123</code>
      </small>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
