{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — AI NIDS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'ids_app/css/style.css' %}">
</head>
<body style="background:#0a0d14; padding-top:0;">

<div class="login-wrapper" style="min-height:100vh;">
  <div class="login-card" style="max-width:460px;">
    <div class="text-center mb-4">
      <div style="font-size:3rem;">🛡️</div>
      <h3 class="fw-bold mt-2">Create Account</h3>
      <p class="text-muted small">Join AI NIDS Security Platform</p>
    </div>

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} py-2 small">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small text-muted">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">Email</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" class="form-control">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary"><i class="bi bi-lock"></i></span>
          <input type="password" name="password1" class="form-control" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label small text-muted">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary"><i class="bi bi-lock-fill"></i></span>
          <input type="password" name="password2" class="form-control" required>
        </div>
      </div>
      <button type="submit" class="btn btn-success w-100 fw-semibold">
        <i class="bi bi-person-plus me-2"></i>Register
      </button>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted">Already have an account? <a href="{% url 'login' %}" class="text-primary">Sign In</a></small>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
